// Proposed gRPC schema for teammate review; NOT a running or verified gRPC service.
// The implemented transport is the local persistent worker documented in docs/api.md.
syntax = "proto3";
package ecoroute.v1;

message Coordinate { double latitude = 1; double longitude = 2; }
message NodePair { uint64 source = 1; uint64 target = 2; }
message CoordinatePair { Coordinate origin = 1; Coordinate destination = 2; }
message RouteRequest {
  oneof endpoints { NodePair nodes = 1; CoordinatePair coordinates = 2; }
  string vehicle_profile_id = 3;
  double preference = 4;
  int64 departure_time_unix_seconds = 5;
  uint32 max_routes = 6; // Must be 1..3; clients explicitly send 3 for the default.
  double max_extra_time_ratio = 7;
  double max_extra_time_seconds = 8;
}
message Metrics {
  double duration_seconds = 1;
  double distance_meters = 2;
  double co2e_grams = 3;
  double fuel_milliliters = 4;
  double electricity_wh = 5;
}
message ObjectiveScore {
  double preference = 1;
  uint64 integer_cost = 2;
  double integer_scale = 3;
  double maximum_path_objective_error = 4;
}
message Route {
  string id = 1;
  repeated uint64 road_segment_ids = 2;
  repeated Coordinate geometry = 3; // Convert explicitly to GeoJSON [lon,lat].
  Metrics metrics = 4;
  repeated string roles = 5;
  repeated double matching_preferences = 6;
  double extra_time_seconds = 7;
  double co2e_saved_grams = 8;
  bool exceeds_detour_limit = 9;
  bool geometry_is_approximate = 10;
  repeated ObjectiveScore objective_scores = 11;
}
message RouteResponse {
  repeated Route routes = 1;
  string recommended_route_id = 2;
  string graph_version = 3;
  string traffic_version = 4;
  string cost_model_version = 5;
  string objective_version = 6;
  double selected_preference = 7;
  Coordinate snapped_origin = 8;
  Coordinate snapped_destination = 9;
  double origin_snap_distance_meters = 10;
  double destination_snap_distance_meters = 11;
  repeated string warnings = 12;
}
message HealthRequest {}
message HealthResponse {
  bool ready = 1;
  string graph_version = 2;
  string traffic_version = 3;
  string message = 4;
}
service Routing {
  rpc Route(RouteRequest) returns (RouteResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}