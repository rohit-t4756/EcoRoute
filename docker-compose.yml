services:
  database:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoroute}
      POSTGRES_USER: ${POSTGRES_USER:-ecoroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoroute_demo_change_me}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  routing:
    build:
      context: .
      dockerfile: Dockerfile.routing
    volumes:
      - routing_data:/data
    environment:
      ECOROUTE_DATA_DIR: /data
      ECOROUTE_CONFIG: /data/engine.conf
      ECOROUTE_POSTGIS_DSN: postgresql://${POSTGRES_USER:-ecoroute}:${POSTGRES_PASSWORD:-ecoroute_demo_change_me}@database:5432/${POSTGRES_DB:-ecoroute}
      ECOROUTE_ALLOW_DEMO_GRAPH: ${ECOROUTE_ALLOW_DEMO_GRAPH:-true}
      ROUTING_WORKERS: ${ROUTING_WORKERS:-2}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /data/active_graph.json &&
          python -c 'import socket; socket.create_connection(("127.0.0.1",50051),2).close()'
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8000:8000"]
    environment:
      ROUTING_GRPC_TARGET: routing:50051
      ROUTING_DEADLINE_SECONDS: 65
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROUTE_PREFETCH: ${ROUTE_PREFETCH:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecoroute}
      POSTGRES_USER: ${POSTGRES_USER:-ecoroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoroute_demo_change_me}
    depends_on:
      routing: {condition: service_healthy}
      database: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  ml_worker:
    build:
      context: .
      dockerfile: Dockerfile.ml
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecoroute}:${POSTGRES_PASSWORD:-ecoroute_demo_change_me}@database:5432/${POSTGRES_DB:-ecoroute}
      REDIS_HOST: redis
      REDIS_CONTAINER_PORT: 6379
      ML_INTERVAL_SECONDS: ${ML_INTERVAL_SECONDS:-300}
    volumes:
      - routing_data:/data:ro
    depends_on:
      routing: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  map_ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile.ingest
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecoroute}:${POSTGRES_PASSWORD:-ecoroute_demo_change_me}@database:5432/${POSTGRES_DB:-ecoroute}
      INGEST_ADDRESS: ${INGEST_ADDRESS:-Shivaji Nagar, Pune, India}
      INGEST_RADIUS_METERS: ${INGEST_RADIUS_METERS:-2000}
    depends_on:
      database: {condition: service_healthy}
    volumes:
      - ./osm_cache:/app/osm_cache

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_BACKEND_PROXY: http://api:8000
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  routing_data:
